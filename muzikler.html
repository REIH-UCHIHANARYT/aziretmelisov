<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="Aziret Melisov'un dinlediği müzikler.">
  <title>Benim Dinlediklerim | Aziret Melisov</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f7f7f7; --ink:#100303; --purple:#8b5cf6; --muted:#77717d; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .navbar { position:sticky; top:0; z-index:5; padding:18px 0; background:rgba(247,247,247,.92); backdrop-filter:blur(15px); border-bottom:1px solid #ece8f0; }
    .nav-inner { width:min(1120px,calc(100% - 40px)); margin:auto; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { font-size:26px; font-weight:800; letter-spacing:3px; }
    .brand span,.accent { color:var(--purple); }
    .links { display:flex; align-items:center; flex-wrap:wrap; gap:24px; }
    .links a { font-size:14px; font-weight:600; transition:color .2s; }
    .links a:hover,.links a[aria-current="page"] { color:var(--purple); }
    .page { width:min(1120px,calc(100% - 40px)); margin:auto; padding:72px 0 64px; }
    .eyebrow { margin:0 0 14px; color:var(--purple); font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(38px,7vw,68px); line-height:1.05; letter-spacing:-.055em; }
    .intro { max-width:620px; margin:18px 0 34px; color:var(--muted); font-size:16px; line-height:1.8; }
    .music-card { overflow:hidden; padding:22px; border:1px solid #e8e3ec; border-radius:24px; background:#fff; box-shadow:0 24px 70px rgba(16,3,3,.1); }
    .music-player { display:block; width:100%; min-height:600px; border:0; border-radius:14px; }
    .back-link { display:inline-block; margin-top:26px; color:var(--muted); font-size:14px; font-weight:600; }
    .back-link:hover { color:var(--purple); }
    footer { padding:24px 20px; border-top:1px solid #ece8f0; text-align:center; color:var(--muted); font-size:13px; }
    @media(max-width:640px) {
      .navbar { padding:14px 0; }
      .nav-inner { width:calc(100% - 28px); align-items:flex-start; flex-direction:column; gap:10px; }
      .brand { font-size:23px; }
      .links { gap:12px 18px; }
      .links a { font-size:13px; }
      .page { width:calc(100% - 28px); padding:48px 0 44px; }
      .intro { font-size:14px; }
      .music-card { padding:10px; border-radius:18px; }
      .music-player { min-height:600px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <nav class="nav-inner" aria-label="Ana menü">
      <a class="brand" href="index.html#anasayfa">REI<span>H</span>.</a>
      <div class="links">
        <a href="index.html#anasayfa">Ana Sayfa</a>
        <a href="index.html#hakkimda">Hakkımda</a>
        <a href="index.html#projeler">Projeler</a>
        <a href="oyunlar.html">Oyunlar</a>
        <a href="muzikler.html" aria-current="page">Dinlediklerim</a>
        <a href="index.html#iletisim">İletişim</a>
      </div>
    </nav>
  </header>
  <main class="page">
    <p class="eyebrow">Müzikler</p>
    <h1>Benim <span class="accent">Dinlediklerim</span></h1>
    <p class="intro">Dinlediğim şarkıları Spotify çalma listemde bulabilir, aşağıdaki oynatıcıdan açabilirsin.</p>
    <section class="music-card" aria-label="Spotify çalma listem">
      <iframe
        class="music-player"
        title="Spotify — Benim Dinlediklerim çalma listesi"
        src="https://open.spotify.com/embed/playlist/4QYK5oMKySv3QXs3ejie6C?utm_source=generator&theme=0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </section>
    <a class="back-link" href="index.html">← Ana sayfaya dön</a>
  </main>
  <footer>© 2026 Aziret Melisov</footer>
</body>
</html>
